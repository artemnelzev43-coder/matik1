<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cookie</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b0f0d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center}
video{display:none;width:min(900px,92vw);max-height:80vh;border-radius:18px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(440px,94vw);background:#151a17;border:1px solid #303833;border-radius:24px;padding:28px;box-shadow:0 20px 70px #000}
button{width:100%;height:58px;border:0;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;margin-top:12px}
.accept{background:#20c463;color:white}
.reject{background:#e53935;color:white}
button:hover{filter:brightness(1.1)}
#error{display:none;position:fixed;inset:0;place-items:center;text-align:center;font-size:24px;color:#ff5b57}
</style>
</head>
<body>
<video id="video" controls playsinline>
<source src="video.mp4" type="video/mp4">
</video>

<div class="overlay" id="cookie">
  <div class="card">
    <button class="accept" onclick="acceptCookies()">✓ ПРИНЯТЬ</button>
    <button class="reject" onclick="rejectCookies()">✕ ОТКАЗАТЬСЯ</button>
  </div>
</div>

<div id="error">❌ Ошибка</div>

<script>
function acceptCookies(){
  localStorage.setItem("cookiesAccepted","1");
  document.getElementById("cookie").style.display="none";
  const video=document.getElementById("video");
  video.style.display="block";
  video.play().catch(()=>{});
}
function rejectCookies(){
  document.getElementById("cookie").style.display="none";
  document.getElementById("error").style.display="grid";
}
</script>
</body>
</html>
